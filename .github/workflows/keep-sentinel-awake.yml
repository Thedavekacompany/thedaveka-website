name: Keep Sentinel awake

# Visits Sentinel every 5 minutes so the app never goes to sleep and its
# hourly guardrail checks and autopilot keep running. If Sentinel is down
# the run fails, and GitHub emails the repo owner.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Sentinel health check
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 30 \
            https://identity-guardian--davekacompany.replit.app/api/healthz
